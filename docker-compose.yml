services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pharma_traceability
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ipfs:
    image: ipfs/kubo:v0.34.1
    ports:
      - "5001:5001"
      - "8081:8080"
    volumes:
      - ipfs_data:/data/ipfs
      - ipfs_export:/export

volumes:
  postgres_data:
  ipfs_data:
  ipfs_export:
